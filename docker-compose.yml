services:
  bot:
    build: .
    container_name: douyin_email_bot
    restart: unless-stopped
    volumes:
      - /srv/nas_data/douyin_downloads:/app/downloads
      - logs:/app/logs
      - firefox_profile:/app/firefox_profile
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env
    environment:
      - DOUYIN_DOWNLOAD_PATH=/app/downloads
      - BILIBILI_DOWNLOAD_PATH=/app/downloads/bilibili
      - BILIBILI_AUTH_FILE=/app/firefox_profile/yutto_auth.json
      - BILIBILI_YUTTO_BIN=yutto
      - COOKIE_PROFILE_DIR=/app/firefox_profile
      - TZ=Asia/Shanghai
      # Keep Douyin traffic direct even when the Docker host has proxy vars set.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - NO_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - no_proxy=
      # Optional: enable .env auto-reload so bot picks up cookie
      # changes without restart (requires web_login to write to .env)
      - ENV_AUTO_RELOAD=1

  web_login:
    build: .
    container_name: douyin_web_login
    restart: "no"
    ports:
      # Keep the host entry point local; expose it to the tailnet with
      # `tailscale serve`. The explicit LAN binding below is for the trusted
      # home network only; set LAN_BIND_ADDRESS to the server's LAN IP.
      - "127.0.0.1:8080:8080"
      - "${LAN_BIND_ADDRESS:-192.168.1.94}:8080:8080"
    volumes:
      - firefox_profile:/app/firefox_profile
      - ./.env:/app/.env
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - COOKIE_PROFILE_DIR=/app/firefox_profile
      - TZ=Asia/Shanghai
      - WEB_LOGIN_ALLOWED_ORIGINS=${WEB_LOGIN_ALLOWED_ORIGINS:-}
    # The container needs an all-interface bind; host port publication remains
    # limited to loopback plus the explicit trusted LAN address above.
    command: ["python3", "web_login.py", "--host", "0.0.0.0"]
    profiles:
      - login

  file_browser:
    build: .
    container_name: douyin_file_browser
    restart: unless-stopped
    ports:
      # Keep both the trusted home-LAN and Tailscale paths explicit; never use
      # 0.0.0.0 or a guest/IoT network address here.
      - "127.0.0.1:8081:8081"
      - "${LAN_BIND_ADDRESS:-192.168.1.94}:8081:8081"
    volumes:
      - /srv/nas_data/douyin_downloads:/app/downloads
      - /srv/nas_data/comics:/app/comics:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - DOUYIN_DOWNLOAD_PATH=/app/downloads
      - COMICS_PICS_PATH=/app/comics/pics
      - TZ=Asia/Shanghai
      - FILE_BROWSER_ALLOWED_ORIGINS=${FILE_BROWSER_ALLOWED_ORIGINS:-}
      - FILE_BROWSER_MAX_UPLOAD_BYTES=${FILE_BROWSER_MAX_UPLOAD_BYTES:-2147483648}
      - FILE_BROWSER_MAX_UPLOAD_FILES=${FILE_BROWSER_MAX_UPLOAD_FILES:-10}
      - FILE_BROWSER_MEDIA_MAX_CONCURRENCY=${FILE_BROWSER_MEDIA_MAX_CONCURRENCY:-2}
    command: ["python3", "file_browser.py"]

volumes:
  logs:
    driver: local
  firefox_profile:
    driver: local

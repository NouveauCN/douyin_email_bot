services:
  bot:
    build: .
    container_name: douyin_email_bot
    restart: unless-stopped
    volumes:
      - /srv/nas_data/douyin_downloads:/app/downloads
      - logs:/app/logs
      - state:/app/state
      - runtime_settings:/app/runtime-settings
      - firefox_profile:/app/firefox_profile
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env
    environment:
      - DOUYIN_DOWNLOAD_PATH=/app/downloads
      - BILIBILI_DOWNLOAD_PATH=/app/downloads/bilibili
      - BILIBILI_AUTH_FILE=/app/firefox_profile/yutto_auth.json
      - BILIBILI_YUTTO_BIN=yutto
      - COOKIE_PROFILE_DIR=/app/firefox_profile
      - BOT_TRANSIENT_PENDING_FILE=/app/state/pending_retries.json
      - BOT_TRANSIENT_FAILED_FILE=/app/state/failed_links.txt
      - BOT_STATE_DB=/app/state/mail_state.sqlite3
      - RUNTIME_SETTINGS_DB=/app/runtime-settings/settings.sqlite3
      - BOT_DURABLE_MAIL_ENABLED=${BOT_DURABLE_MAIL_ENABLED:-1}
      # Internal-only QQ bridge; the gateway reaches this over the Compose network.
      - QQ_BRIDGE_HOST=0.0.0.0
      - QQ_BRIDGE_PORT=8082
      - QQ_BRIDGE_TOKEN=${QQ_BRIDGE_TOKEN:-}
      - QQBOT_REPLY_WINDOW_SECONDS=${QQBOT_REPLY_WINDOW_SECONDS:-3600}
      - QQBOT_OUTBOX_LEASE_SECONDS=${QQBOT_OUTBOX_LEASE_SECONDS:-120}
      - TZ=Asia/Shanghai
      # Keep Douyin traffic direct even when the Docker host has proxy vars set.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - NO_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - no_proxy=

  web_login:
    build: .
    container_name: douyin_web_login
    restart: "no"
    ports:
      # Keep the host entry point local; expose it to the tailnet with
      # `tailscale serve`. The explicit LAN binding below is for the trusted
      # home network only; set LAN_BIND_ADDRESS to the server's LAN IP.
      - "127.0.0.1:8080:8080"
      - "${LAN_BIND_ADDRESS:-192.168.1.94}:8080:8080"
    volumes:
      - firefox_profile:/app/firefox_profile
      - runtime_settings:/app/runtime-settings
      - ./.env:/app/.env
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - COOKIE_PROFILE_DIR=/app/firefox_profile
      - RUNTIME_SETTINGS_DB=/app/runtime-settings/settings.sqlite3
      - TZ=Asia/Shanghai
      - WEB_LOGIN_ALLOWED_ORIGINS=${WEB_LOGIN_ALLOWED_ORIGINS:-}
    # The container needs an all-interface bind; host port publication remains
    # limited to loopback plus the explicit trusted LAN address above.
    command: ["python3", "web_login.py", "--host", "0.0.0.0"]
    profiles:
      - login

  file_browser:
    build: .
    container_name: douyin_file_browser
    restart: unless-stopped
    ports:
      # Keep both the trusted home-LAN and Tailscale paths explicit; never use
      # 0.0.0.0 or a guest/IoT network address here.
      - "127.0.0.1:8081:8081"
      - "${LAN_BIND_ADDRESS:-192.168.1.94}:8081:8081"
    volumes:
      - /srv/nas_data/douyin_downloads:/app/downloads
      - /srv/nas_data/comics:/app/comics:ro
      - runtime_settings:/app/runtime-settings
      - ./config.yaml:/app/config.yaml:ro
      # Read-only bootstrap fallback so the Settings tab can report whether
      # legacy credentials are configured without ever returning their value.
      - ./.env:/app/.env:ro
    environment:
      - DOUYIN_DOWNLOAD_PATH=/app/downloads
      - COMICS_PICS_PATH=/app/comics/pics
      - RUNTIME_SETTINGS_DB=/app/runtime-settings/settings.sqlite3
      - TZ=Asia/Shanghai
      # Leave empty unless an exact trusted origin is explicitly configured;
      # Settings PATCH intentionally returns 403 without this allowlist.
      - FILE_BROWSER_ALLOWED_ORIGINS=${FILE_BROWSER_ALLOWED_ORIGINS:-}
      - FILE_BROWSER_MAX_UPLOAD_BYTES=${FILE_BROWSER_MAX_UPLOAD_BYTES:-2147483648}
      - FILE_BROWSER_MAX_UPLOAD_FILES=${FILE_BROWSER_MAX_UPLOAD_FILES:-10}
      - FILE_BROWSER_MEDIA_MAX_CONCURRENCY=${FILE_BROWSER_MEDIA_MAX_CONCURRENCY:-2}
    command: ["python3", "file_browser.py"]

  qq_gateway:
    build: ./qq_gateway
    container_name: douyin_qq_gateway
    restart: unless-stopped
    depends_on:
      - bot
    volumes:
      - qq_gateway_state:/app/qq-gateway-state
    environment:
      - QQBOT_APP_ID=${QQBOT_APP_ID:-}
      - QQBOT_APP_SECRET=${QQBOT_APP_SECRET:-}
      - QQBOT_ALLOWED_OPENIDS=${QQBOT_ALLOWED_OPENIDS:-}
      - QQ_BRIDGE_URL=${QQ_BRIDGE_URL:-http://bot:8082}
      - QQ_BRIDGE_TOKEN=${QQ_BRIDGE_TOKEN:-}
      - QQBOT_STATE_DIR=/app/qq-gateway-state
      - QQBOT_OUTBOX_POLL_MS=${QQBOT_OUTBOX_POLL_MS:-1000}
      - QQBOT_OUTBOX_CLAIM_SIZE=${QQBOT_OUTBOX_CLAIM_SIZE:-10}
      - QQBOT_REQUEST_TIMEOUT_MS=${QQBOT_REQUEST_TIMEOUT_MS:-15000}
      - TZ=Asia/Shanghai

volumes:
  logs:
    driver: local
  firefox_profile:
    driver: local
  state:
    driver: local
  runtime_settings:
    driver: local
  qq_gateway_state:
    driver: local

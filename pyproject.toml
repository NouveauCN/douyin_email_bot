[project]
name = "douyin-email-bot"
version = "0.2.0"
description = "Email bot that downloads Douyin and Bilibili videos from shared links"
requires-python = ">=3.12,<3.13"
dependencies = [
    "colorama==0.4.6",
    "f2==0.0.1.7",
    "flask==3.1.3",
    "httpx==0.27.2",
    "pillow==12.3.0",
    "playwright==1.62.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.2",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

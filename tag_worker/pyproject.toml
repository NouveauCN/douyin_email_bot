[project]
name = "comics-tag-worker"
version = "0.1.0"
description = "Optional CPU worker that tags comics gallery images into JSON sidecars"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow==13.0.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.21.0",
]

# Dependency-only project (no build system): uv installs the locked
# requirements and never tries to package these modules. This lock belongs to
# tag_worker alone, mirroring the yutto dependency isolation precedent.
[tool.uv]
package = false

# CPU-only PyTorch wheels. The index is explicit so torch/torchvision can
# never resolve to the CUDA-bundled PyPI builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
